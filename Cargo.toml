[package]
name = "chatbot"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "chatbot"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenv = "0.15"
rustyline = "14"
anyhow = "1"
axum = "0.7"
